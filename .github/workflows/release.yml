name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Ensure npm supports OIDC trusted publishing (>= 11.5.1)
        run: |
          npm install -g npm@latest
          npm --version

      - name: Strip empty _authToken so OIDC is used, not classic token auth
        run: |
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          sed -i '/_authToken/d' "$npmrc"

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test

      - run: npm publish --workspace packages/core --provenance --access public

      - name: Publish to GitHub Packages
        run: |
          cd packages/core
          node -e "const fs=require('fs'),p='package.json',j=JSON.parse(fs.readFileSync(p,'utf8'));j.name='@uzen-zone/paddleocr-js';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')"
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          printf '\n//npm.pkg.github.com/:_authToken=%s\n@uzen-zone:registry=https://npm.pkg.github.com\n' "$NODE_AUTH_TOKEN" >> "$npmrc"
          npm publish --ignore-scripts --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}