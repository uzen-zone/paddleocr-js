name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Ensure npm supports OIDC trusted publishing (>= 11.5.1)
        run: |
          npm install -g npm@latest
          npm --version

      - name: Strip empty _authToken so OIDC is used, not classic token auth
        run: |
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          sed -i '/_authToken/d' "$npmrc"

      - name: Print OIDC claims and npm config (diagnostics)
        run: |
          echo "=== npm version / registry ==="
          npm config get registry
          echo "=== .npmrc (after strip) ==="
          cat "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}" || true
          echo "=== OIDC claims ==="
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            TOKEN=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sigstore")
            PAYLOAD=$(echo "$TOKEN" | cut -d. -f2)
            MOD=$(( $(echo -n "$PAYLOAD" | wc -c) % 4 ))
            if [ "$MOD" -eq 2 ]; then PAYLOAD="$PAYLOAD=="; elif [ "$MOD" -eq 3 ]; then PAYLOAD="$PAYLOAD="; fi
            echo "$PAYLOAD" | tr '_-' '/+' | base64 -d 2>/dev/null | jq .
          else
            echo "NO OIDC TOKEN AVAILABLE - check 'id-token: write' permission"
          fi

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test

      - run: npm publish --workspace packages/core --provenance --access public