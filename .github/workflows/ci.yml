name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      # Same gates as release.yml, minus the publish. `format:check` is
      # deliberately excluded: it currently fails on a clean main (24 files),
      # so including it would make every run red regardless of the change.
      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test

      - run: npm run build:sdk

      - run: npm run build:demo
